name: CI (sample pipeline)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  sample-pipeline:
    runs-on: ubuntu-latest
    env:
      DATA_MODE: sample

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build sample dataset (from seed)
        run: |
          python scripts/00_make_sample.py

      - name: Run pipeline (sample)
        run: |
          python scripts/01_load_raw_to_duckdb.py
          python scripts/02_profile_and_checks.py
          python scripts/03_build_silver.py
          python scripts/04_build_gold.py
      - name: Upload gold parquet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gold_parquet_sample
          path: data/gold_parquet/*.parquet
